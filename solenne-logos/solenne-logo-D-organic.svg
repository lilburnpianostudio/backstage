<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 718" role="img" aria-labelledby="title desc">
  <title id="title">Solenne Naturals logo, concept D: organic</title>
