<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 620" role="img" aria-labelledby="title desc">
  <title id="title">Solenne Naturals logo, concept C: geometric</title>
  <desc id="desc">Geometric lotus rising from a half sun, built from bold simple shapes, above the Solenne Naturals wordmark and tagline.</desc>
  <rect id="background" width="600" height="620" fill="#F5F0E8"/>
  <g id="mark" stroke-linejoin="round">
    <path id="sun" d="M122,296 A178,178 0 0 1 478,296 Z" fill="none" stroke="#C5A55A" stroke-width="12"/>
  <g id="petals" stroke="#F5F0E8" stroke-width="6" paint-order="stroke">
    <path d="M300,296 C301.3,252.5 349.9,231.4 406,239.7 C381.5,290.7 336.8,319.2 300,296Z" fill="#B8A9C9"/>
    <path d="M300,296 C263.2,319.2 218.5,290.7 194,239.7 C250.1,231.4 298.7,252.5 300,296Z" fill="#B8A9C9"/>
    <path d="M300,296 C278.4,251.5 316.4,197.3 377.3,167.4 C379.4,235.2 349.4,294.2 300,296Z" fill="#E8C4B8"/>
    <path d="M300,296 C250.6,294.2 220.6,235.2 222.7,167.4 C283.6,197.3 321.6,251.5 300,296Z" fill="#E8C4B8"/>
    <path d="M300,296 C255,264.3 260,186.9 300,120 C340,186.9 345,264.3 300,296Z" fill="#5B7553"/>
  </g>
  </g>
  <g id="wordmark">
    <text id="name" x="300" y="450" text-anchor="middle" font-family="Georgia, Palatino, serif" font-size="92" letter-spacing="2" fill="#5B7553">Solenne</text>
    <text id="descriptor" x="308" y="502" text-anchor="middle" font-family="Georgia, Palatino, serif" font-size="24" letter-spacing="16" fill="#5B7553">NATURALS</text>
  </g>
  <g id="tagline">
    <path id="tagline-rule" d="M272,534 L328,534" stroke="#C5A55A" stroke-width="2" stroke-linecap="round" fill="none"/>
    <text id="tagline-text" x="300" y="570" text-anchor="middle" font-family="Georgia, Palatino, serif" font-style="italic" font-size="21" letter-spacing="0.5" fill="#5B7553">Elegance Rooted in Nature.</text>
  </g>
</svg>
